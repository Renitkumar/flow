<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login — Flow</title>

    <link rel="stylesheet" href="auth.css">
</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <a href="index.html" class="auth-logo">
            <span class="logo-house">⌂</span>
            fl<span>o</span>w
        </a>

        <!-- LOGIN -->
        <div id="loginBox">

            <h1>Welcome back 👋</h1>

            <p class="auth-subtitle">
                Login to continue to Flow
            </p>

            <form id="loginForm">

                <label>Email</label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >

                <label>Password</label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit" class="auth-btn">
                    Login
                </button>

            </form>

            <p id="loginMessage" class="auth-message"></p>

            <div class="auth-switch">
                Don't have an account?
                <button type="button" id="showSignup">
                    Create account
                </button>
            </div>

        </div>


        <!-- SIGNUP -->
        <div id="signupBox" style="display:none;">

            <h1>Create account 🚀</h1>

            <p class="auth-subtitle">
                Join Flow and start exploring properties
            </p>

            <form id="signupForm">

                <label>Full Name</label>

                <input
                    type="text"
                    id="signupName"
                    placeholder="Enter your full name"
                    required
                >

                <label>Email</label>

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Enter your email"
                    required
                >

                <label>Phone</label>

                <input
                    type="tel"
                    id="signupPhone"
                    placeholder="10-digit mobile number"
                    maxlength="10"
                >

                <label>Password</label>

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Minimum 6 characters"
                    minlength="6"
                    required
                >
                <div class="otp-section" id="otpSection" style="display:none;">
    <label for="otp">Email OTP</label>
    <input
        type="text"
        id="otp"
        maxlength="8"
        inputmode="numeric"
        placeholder="Enter 8-digit OTP"
    >

    <button type="button" id="verifyOtpBtn">
        Verify OTP
    </button>
</div>

           <button type="button" id="signupBtn">
    Create Account 🚀
</button>

            </form>

            <p id="signupMessage" class="auth-message"></p>

            <div class="auth-switch">
                Already have an account?
                <button type="button" id="showLogin">
                    Login
                </button>
            </div>

        </div>

    </div>

</div>


<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Flow Auth -->
<script src="auth.js"></script>

</body>
</html>>
